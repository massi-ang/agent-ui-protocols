<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
<rect x="20" y="60" width="180" height="80" rx="12" fill="rgba(192,132,252,0.12)" stroke="#c084fc" stroke-width="1.5"/>
<text x="110" y="95" text-anchor="middle" fill="#c084fc" font-weight="700" font-size="14" font-family="Inter,sans-serif">Agent</text>
<text x="110" y="115" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter,sans-serif">reads state, calls tools</text>
<rect x="500" y="60" width="180" height="80" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8" stroke-width="1.5"/>
<text x="590" y="95" text-anchor="middle" fill="#a5b4fc" font-weight="700" font-size="14" font-family="Inter,sans-serif">Frontend</text>
<text x="590" y="115" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter,sans-serif">defines tools, shares state</text>
<line x1="200" y1="85" x2="490" y2="85" stroke="#34d399" stroke-width="1.5"/>
<path d="M485,79 l8,6 l-8,6" fill="none" stroke="#34d399" stroke-width="1.5"/>
<text x="345" y="78" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600" font-family="Inter,sans-serif">StateSnapshot / StateDelta</text>
<line x1="500" y1="115" x2="210" y2="115" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
<path d="M215,109 l-8,6 l8,6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
<text x="345" y="132" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600" font-family="Inter,sans-serif">Frontend Tools (agent invokes)</text>
<text x="350" y="175" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic" font-family="Inter,sans-serif">Agent reads UI state → makes decisions → calls frontend tools → instant update</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#0f0f1a" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#a5b4fc">MCP Apps Protocol Flow</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#64748b">Open-ended Generative UI — Full HTML/JS apps in sandboxed iframes</text>

  <!-- Row 1: User → LLM Host → MCP Tool Call -->
  <rect x="50" y="85" width="120" height="56" rx="10" fill="rgba(129,140,248,0.12)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="110" y="110" text-anchor="middle" font-weight="600" font-size="13" fill="#a5b4fc">User</text>
  <text x="110" y="126" text-anchor="middle" font-size="10" fill="#64748b">Prompt</text>

  <rect x="270" y="85" width="160" height="56" rx="10" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350" y="110" text-anchor="middle" font-weight="600" font-size="13" fill="#38bdf8">LLM (Host)</text>
  <text x="350" y="126" text-anchor="middle" font-size="10" fill="#64748b">Claude Desktop / VS Code</text>

  <rect x="530" y="85" width="160" height="56" rx="10" fill="rgba(192,132,252,0.12)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="610" y="110" text-anchor="middle" font-weight="600" font-size="13" fill="#c084fc">MCP Tool Call</text>
  <text x="610" y="126" text-anchor="middle" font-size="10" fill="#64748b">create_chart(data)</text>

  <!-- Arrows Row 1 -->
  <line x1="170" y1="113" x2="262" y2="113" stroke="#64748b" stroke-width="1.5"/>
  <path d="M258,108 l8,5 l-8,5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="216" cy="113" r="10" fill="#818cf8"/>
  <text x="216" y="117" text-anchor="middle" font-size="9" font-weight="700" fill="white">1</text>

  <line x1="430" y1="113" x2="522" y2="113" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M518,108 l8,5 l-8,5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="476" cy="113" r="10" fill="#38bdf8"/>
  <text x="476" y="117" text-anchor="middle" font-size="9" font-weight="700" fill="white">2</text>

  <!-- Tool call → MCP Server -->
  <line x1="610" y1="141" x2="610" y2="185" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M604,179 l6,8 l6,-8" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="610" cy="163" r="10" fill="#c084fc"/>
  <text x="610" y="167" text-anchor="middle" font-size="9" font-weight="700" fill="white">3</text>

  <!-- MCP Server -->
  <rect x="480" y="190" width="260" height="60" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="610" y="215" text-anchor="middle" font-weight="600" font-size="13" fill="#fbbf24">MCP Server</text>
  <text x="610" y="233" text-anchor="middle" font-size="10" fill="#94a3b8">Processes request, generates HTML app</text>

  <!-- Server returns UIResource -->
  <line x1="610" y1="250" x2="610" y2="295" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M604,289 l6,8 l6,-8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="610" cy="272" r="10" fill="#fbbf24"/>
  <text x="610" y="276" text-anchor="middle" font-size="9" font-weight="700" fill="white">4</text>
  <text x="660" y="275" font-size="9" fill="#fbbf24">UIResource</text>

  <!-- UIResource pill -->
  <rect x="470" y="300" width="280" height="36" rx="18" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="610" y="323" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="'SF Mono', Menlo, monospace">uri: "ui://chart-view"</text>

  <!-- Host fetches HTML -->
  <line x1="470" y1="318" x2="350" y2="318" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M357,312 l-8,6 l8,6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="410" cy="318" r="10" fill="#38bdf8"/>
  <text x="410" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="white">5</text>
  <text x="410" y="305" text-anchor="middle" font-size="9" fill="#94a3b8">Host fetches HTML</text>

  <!-- Host renders in iframe -->
  <rect x="180" y="300" width="170" height="36" rx="8" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="265" y="323" text-anchor="middle" font-size="11" fill="#38bdf8">Host renders →</text>

  <line x1="265" y1="336" x2="265" y2="375" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M259,369 l6,8 l6,-8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="265" cy="355" r="10" fill="#818cf8"/>
  <text x="265" y="359" text-anchor="middle" font-size="9" font-weight="700" fill="white">6</text>

  <!-- Sandboxed iframe -->
  <rect x="100" y="380" width="600" height="70" rx="10" fill="rgba(16,185,129,0.06)" stroke="#34d399" stroke-width="1.5"/>
  <!-- Inner sandbox indicator -->
  <rect x="110" y="388" width="580" height="54" rx="6" fill="rgba(30,41,59,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="412" text-anchor="middle" font-weight="600" font-size="13" fill="#34d399">Sandboxed iframe (inline in chat)</text>
  <text x="400" y="430" text-anchor="middle" font-size="10" fill="#64748b">D3 charts • Three.js • Interactive tables • Full web apps</text>

  <!-- Shield icon indicator -->
  <rect x="108" y="386" width="60" height="18" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="138" y="398" text-anchor="middle" font-size="8" fill="#34d399">🛡 sandbox</text>

  <!-- postMessage (not yet supported) -->
  <line x1="700" y1="415" x2="780" y2="415" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="780" y1="415" x2="780" y2="113" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="780" y1="113" x2="698" y2="113" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M705,108 l-8,5 l8,5" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.5"/>
  <text x="810" y="270" font-size="9" fill="#fb7185" opacity="0.6" transform="rotate(90,810,270)">postMessage (not yet in clients)</text>

  <!-- Legend -->
  <rect x="30" y="468" width="500" height="40" rx="8" fill="rgba(30,41,59,0.6)" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
  <line x1="50" y1="488" x2="80" y2="488" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="492" font-size="9" fill="#94a3b8">Host actions</text>
  <line x1="160" y1="488" x2="190" y2="488" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="195" y="492" font-size="9" fill="#94a3b8">Server response</text>
  <line x1="290" y1="488" x2="320" y2="488" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="325" y="492" font-size="9" fill="#94a3b8">UI→Agent (spec only, not implemented)</text>
</svg>

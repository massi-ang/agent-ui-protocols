<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Inter, -apple-system, sans-serif">

  <!-- DARK THEME (left) -->
  <rect x="0" y="0" width="500" height="620" fill="#0f0f1a" rx="12"/>
  <text x="250" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Dark Theme</text>

  <!-- Background -->

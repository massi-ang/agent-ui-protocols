services:
  ag-ui-frontend:
    build:
      context: ./ag-ui-sample/frontend
    ports:
      - "3001:3001"
    environment:
      - AGENT_URL=http://ag-ui-backend:8080/invocations
      - NODE_ENV=production
    depends_on:
      - ag-ui-backend
    restart: unless-stopped
    networks:
      - credentials_provider_network

  ag-ui-backend:
    build:
      context: ./ag-ui-sample/backend
    ports:
      - "8080:8080"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      - SIDESEAT_ENDPOINT=http://sideseat:5388
    depends_on:
      - sideseat
    restart: unless-stopped
    networks:
      - credentials_provider_network

  a2ui-sample:
    build:
      context: ./a2ui-sample
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      - SIDESEAT_ENDPOINT=http://sideseat:5388
    depends_on:
      - sideseat
    restart: unless-stopped
    networks:
      - credentials_provider_network

  mcp-apps-sample:
    build:
      context: ./mcp-apps-sample
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
    restart: unless-stopped
    networks:
      - credentials_provider_network

  json-render-agent:
    build:
      context: ./json-render-sample/agent
    ports:
      - "8081:8081"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      - PORT=8081
    restart: unless-stopped
    networks:
      - credentials_provider_network

  json-render-frontend:
    build:
      context: ./json-render-sample/frontend
    ports:
      - "3004:3004"
    environment:
      - NEXT_PUBLIC_AGENT_URL=http://localhost:8081
    depends_on:
      - json-render-agent
    restart: unless-stopped
    networks:
      - credentials_provider_network

  open-generative-ui-backend:
    build:
      context: ./open-generative-ui-sample/agent
    ports:
      - "8082:8082"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      - SIDESEAT_ENDPOINT=http://sideseat:5388
    depends_on:
      - sideseat
    restart: unless-stopped
    networks:
      - credentials_provider_network

  open-generative-ui-frontend:
    build:
      context: ./open-generative-ui-sample/frontend
    ports:
      - "3005:3005"
    environment:
      - AGENT_URL=http://open-generative-ui-backend:8082/invocations
      - NODE_ENV=production
    depends_on:
      - open-generative-ui-backend
    restart: unless-stopped
    networks:
      - credentials_provider_network

  ag-ui-address-backend:
    build:
      context: ./ag-ui-address-sample/backend
    ports:
      - "8083:8080"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      - SIDESEAT_ENDPOINT=http://sideseat:5388
    depends_on:
      - sideseat
    restart: unless-stopped
    networks:
      - credentials_provider_network

  ag-ui-address-frontend:
    build:
      context: ./ag-ui-address-sample/frontend
    ports:
      - "3006:3006"
    environment:
      - AGENT_URL=http://ag-ui-address-backend:8080/invocations
      - NODE_ENV=production
    depends_on:
      - ag-ui-address-backend
    restart: unless-stopped
    networks:
      - credentials_provider_network

  sideseat:
    image: node:22-slim
    command: sh -c "apt-get update && apt-get install -y ca-certificates && npm install -g sideseat && sideseat --host 0.0.0.0 --no-auth --pricing-sync-hours 0 --no-update-check"
    ports:
      - "5388:5388"
    environment:
      - SIDESEAT_DATA_DIR=/data
      - SIDESEAT_CONFIG_DIR=/config
      - SIDESEAT_CACHE_DIR=/cache
    volumes:
      - ./sideseat/data:/data
      - ./sideseat/config:/config
      - ./sideseat/cache:/cache
    restart: unless-stopped
    networks:
      - credentials_provider_network

networks:
  credentials_provider_network:
    external: true

version: '3.8'

services:
  ag-ui-frontend:
    build:
      context: ./ag-ui-sample/frontend
    ports:
      - "3001:3001"
    environment:
      - AGENT_URL=http://ag-ui-backend:8080/invocations
      - NODE_ENV=production
    depends_on:
      - ag-ui-backend
    restart: unless-stopped
    networks:
      - credentials_provider_network

  ag-ui-backend:
    build:
      context: ./ag-ui-sample/backend
    ports:
      - "8080:8080"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
    restart: unless-stopped
    networks:
      - credentials_provider_network

  a2ui-sample:
    build:
      context: ./a2ui-sample
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
    restart: unless-stopped
    networks:
      - credentials_provider_network

  mcp-apps-sample:
    build:
      context: ./mcp-apps-sample
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - AWS_CONTAINER_CREDENTIALS_FULL_URI=http://169.254.170.2:8000/credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL=${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
    restart: unless-stopped
    networks:
      - credentials_provider_network

networks:
  credentials_provider_network:
    external: true
